spring:
  application:
    name: peachwuhu
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 2GB
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

server:
  port: 18000
  servlet:
    session:
      cookie:
        name: peachwuhu_session
        http-only: true
        same-site: lax

peachwuhu:
  preview-size: 400
  allowed-extensions: jpg,jpeg,png,heic,heif,webp,mp4,mov,m4v,webm,3gp
  auth:
    trusted-device-days: 30
    trusted-cookie-secure: false
