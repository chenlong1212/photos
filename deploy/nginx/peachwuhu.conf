location = /peachwuhu {
    return 301 /peachwuhu/;
}

location ^~ /peachwuhu/api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:18000/api/;
}

location ^~ /peachwuhu/media/ {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:18000/media/;
}

location ^~ /peachwuhu/ {
    alias /opt/peachwuhu/current/dist/;
    try_files $uri $uri/ /peachwuhu/index.html;
}
